name: CI

on:
  push:
    branches:
      - master
      - 'ci/**'
  pull_request:
    branches:
      - master
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-and-unit:
    name: Static, Manifest, Dual-AWK Unit & Upgrade
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Ensure CI dependencies
        run: |
          set -euo pipefail
          need=()
          for p in gawk:gawk mawk:mawk unzip:unzip jq:jq shellcheck:shellcheck curl:curl git:git python3:python3; do
            command -v "${p%%:*}" >/dev/null 2>&1 || need+=("${p##*:}")
          done
          if ((${#need[@]})); then
            sudo apt-get update -qq
            DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -qq "${need[@]}"
          fi
          printf 'awk: %s\n' "$(command -v gawk) $(command -v mawk)"

      - name: Verify manifest, hygiene, version bump, static checks, dual AWK & upgrade
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          sha256sum -c SHA256SUMS
          bash scripts/refresh-manifest.sh --check
          python3 scripts/check-public-hygiene.py
          base_args=()
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            base_args=(--base "$PR_BASE_SHA")
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" ]]; then
            base_args=(--base "$PUSH_BEFORE_SHA")
          fi
          bash check-version-bump.sh "${base_args[@]}"
          bash tests/run-ci.sh syntax
          bash tests/run-ci.sh static
          bash tests/run-ci.sh unit --awk-bin mawk
          bash tests/run-ci.sh unit --awk-bin gawk
          bash tests/run-ci.sh stateful-upgrade

  native-and-container-e2e:
    name: Pinned Cores, Webroot & Isolated Installer E2E
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify pinned native cores, webroot & isolated installer (fail-closed)
        run: |
          set -euo pipefail
          cores=$(mktemp -d)
          trap 'rm -rf -- "$cores"' EXIT
          bash tests/install-ci-xray.sh "$cores/xray"
          bash tests/install-ci-singbox.sh "$cores/singbox"
          export XRAY_BIN="$cores/xray/xray"
          export XRAY_LOCATION_ASSET="$cores/xray"
          export SINGBOX_BIN="$cores/singbox/sing-box"
          for mode in xray-e2e auth-e2e singbox-e2e webroot-e2e installer-e2e; do
            bash tests/run-ci.sh "$mode"
          done

{
  "name": "H15 rolling source verification",
  "on": {
    "push": {
      "branches": [
        "master",
        "ci/**"
      ]
    },
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "rolling-source": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v5",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Verify candidate bindings, static checks, dual AWK and upgrade",
          "run": "set -euo pipefail\ntest \"$(git rev-parse --is-shallow-repository)\" = false\nprintf '%s  %s\\n' 'f8606553c3410e6c66c177bb205ee81052681a228a3e704d6ed549fbc060f13a' vless-server.sh | sha256sum -c -\nsha256sum -c SHA256SUMS\nbash scripts/refresh-manifest.sh --check\nbash check-version-bump.sh\nbash tests/run-ci.sh syntax\nbash tests/run-ci.sh static\nbash tests/run-ci.sh unit --awk-bin mawk\nbash tests/run-ci.sh unit --awk-bin gawk\nbash tests/run-ci.sh stateful-upgrade\n"
        },
        {
          "name": "Verify pinned native cores, webroot and isolated installer",
          "run": "set -euo pipefail\ncores=$(mktemp -d)\ntrap 'rm -rf -- \"$cores\"' EXIT\nbash tests/install-ci-xray.sh \"$cores/xray\"\nbash tests/install-ci-singbox.sh \"$cores/singbox\"\nexport XRAY_BIN=\"$cores/xray/xray\" XRAY_LOCATION_ASSET=\"$cores/xray\" SINGBOX_BIN=\"$cores/singbox/sing-box\"\nfor mode in xray-e2e auth-e2e singbox-e2e webroot-e2e installer-e2e; do\n  bash tests/run-ci.sh \"$mode\"\ndone\n"
        }
      ]
    }
  }
}
